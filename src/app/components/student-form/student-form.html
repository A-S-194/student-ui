<div class="container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Student Registration</mat-card-title>
        </mat-card-header>
        <br>

        <mat-card-content>
            <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline">
                    <mat-label>Name</mat-label>
                    <input type="text" matInput formControlName="name"/>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input type="email" matInput formControlName="email"/>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Age</mat-label>
                    <input type="number" matInput formControlName="age"/>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="studentForm.invalid">Register Student</button>

            </form>
        </mat-card-content>
    </mat-card>

    <button mat-stroked-button color="primary" type="button" routerLink="/viewStudents"> View All Students</button>
</div>
